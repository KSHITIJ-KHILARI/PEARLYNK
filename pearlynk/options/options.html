<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pearlynk Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Pearlynk Settings</h1>
      <p class="subtitle">Configure automatic analysis behavior</p>
    </header>

    <section class="card">
      <div class="setting-row">
        <div>
          <div class="setting-title">Automatic current-tab checking</div>
          <div class="setting-desc">Automatically analyze the active tab when navigation completes.</div>
        </div>
        <label class="switch">
          <input id="autoCheckToggle" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="card">
      <h3>About</h3>
      <p class="about-text">Pearlynk performs heuristic, offline URL risk scoring. No data is sent externally.</p>
      <p class="about-text">Heuristic analysis; not a guarantee of safety.</p>
    </section>
  </div>

  <script src="options.js"></script>
</body>
</html>
